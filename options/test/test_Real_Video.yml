name: MVSSM_Real
model_type: VideoRecurrentModel
scale: 1
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

datasets:
  test_1:  # the 1st test dataset
    name: BSD
    type: VideoRecurrentSplitClipsTestDataset
    dataroot_gt: /root/MVSSM/Capture_Real_Video/test/blur
    dataroot_lq: /root/MVSSM/Capture_Real_Video/test/blur
    cache_data: False
    data_augment: -1
    io_backend:
      type: disk

    num_frame: 10
    num_overlap: 0

# network structures
network_g:
  type: MVSSML_arch
  channels: 64
  mamba_blocks: [ 3, 4 ]
  fusion_blocks: 15

# path
path:
  pretrain_network_g: /root/MVSSM/experiments/GOPRO_L.pth
  strict_load_g: true

# validation settingsa
val:
  save_img: true
  flip_seq: false
  suffix: ~  # add suffix to saved images, if None, use exp name

  metrics: ~

