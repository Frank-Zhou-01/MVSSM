name: MVSSM-GOPRO-L-Test
model_type: VideoRecurrentModel
scale: 1
num_gpu: 1  # set num_gpu: 0 for cpu mode`
manual_seed: 0

datasets:
  test_1:  # the 1st test dataset
    name: GOPRO-O
    type: VideoRecurrentSplitClipsTestDataset
    dataroot_gt: /root/MVSSM/datasets/GOPRO/test/gt
    dataroot_lq: /root/MVSSM/datasets/GOPRO/test/blur
    data_augment: -1  # ['90', '180', '270', 'V', 'H', 'T', '-1']
    cache_data: False
    io_backend:
      type: disk
    num_frame: 35
    num_overlap: 0

  test_2: # the 1st test dataset
    name: GOPRO-90
    type: VideoRecurrentSplitClipsTestDataset
    dataroot_gt: /root/MVSSM/datasets/GOPRO/test/gt
    dataroot_lq: /root/MVSSM/datasets/GOPRO/test/blur
    data_augment: 90  # ['90', '180', '270', 'V', 'H', 'T', '-1']
    cache_data: False
    io_backend:
      type: disk
    num_frame: 35
    num_overlap: 0

  test_3: # the 1st test dataset
    name: GOPRO-180
    type: VideoRecurrentSplitClipsTestDataset
    dataroot_gt: /root/MVSSM/datasets/GOPRO/test/gt
    dataroot_lq: /root/MVSSM/datasets/GOPRO/test/blur
    data_augment: 180  # ['90', '180', '270', 'V', 'H', 'T', '-1']
    cache_data: False
    io_backend:
      type: disk
    num_frame: 35
    num_overlap: 0

  test_4: # the 1st test dataset
    name: GOPRO-270
    type: VideoRecurrentSplitClipsTestDataset
    dataroot_gt: /root/MVSSM/datasets/GOPRO/test/gt
    dataroot_lq: /root/MVSSM/datasets/GOPRO/test/blur
    data_augment: 270  # ['90', '180', '270', 'V', 'H', 'T', '-1']
    cache_data: False
    io_backend:
      type: disk
    num_frame: 35
    num_overlap: 0

  test_5: # the 1st test dataset
    name: GOPRO-V
    type: VideoRecurrentSplitClipsTestDataset
    dataroot_gt: /root/MVSSM/datasets/GOPRO/test/gt
    dataroot_lq: /root/MVSSM/datasets/GOPRO/test/blur
    data_augment: V  # ['90', '180', '270', 'V', 'H', 'T', '-1']
    cache_data: False
    io_backend:
      type: disk
    num_frame: 35
    num_overlap: 0

  test_6: # the 1st test dataset
    name: GOPRO-H
    type: VideoRecurrentSplitClipsTestDataset
    dataroot_gt: /root/MVSSM/datasets/GOPRO/test/gt
    dataroot_lq: /root/MVSSM/datasets/GOPRO/test/blur
    data_augment: H  # ['90', '180', '270', 'V', 'H', 'T', '-1']
    cache_data: False
    io_backend:
      type: disk
    num_frame: 35
    num_overlap: 0

  test_7: # the 1st test dataset
    name: GOPRO-T
    type: VideoRecurrentSplitClipsTestDataset
    dataroot_gt: /root/MVSSM/datasets/GOPRO/test/gt
    dataroot_lq: /root/MVSSM/datasets/GOPRO/test/blur
    data_augment: T  # ['90', '180', '270', 'V', 'H', 'T', '-1']
    cache_data: False
    io_backend:
      type: disk
    num_frame: 35
    num_overlap: 0

# network structures
network_g:
  type: MVSSML_arch
  channels: 64
  mamba_blocks: [3, 4]
  fusion_blocks: 15

# path
path:
  pretrain_network_g: experiments/GOPRO_L.pth
  strict_load_g: true

# validation settingsa
val:
  save_img: true
  flip_seq: false
  suffix: ~  # add suffix to saved images, if None, use exp name

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
    ssim:
      type: calculate_ssim
      crop_border: 0

